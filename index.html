<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Балкон</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#15173f;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {} }
const buzz = (k, t) => { try { tg && tg.HapticFeedback && (k === 'i' ? tg.HapticFeedback.impactOccurred(t) : tg.HapticFeedback.notificationOccurred(t)); } catch (e) {} };

const cv = document.getElementById('c'), cx = cv.getContext('2d');
const LW = 360, LH = 640, G = 560, AX = 92, AY = 146, MAXPULL = 80, SHOTS = 10, GRAV = 900;
const FONT = '"Trebuchet MS", system-ui, sans-serif';
let sc = 1, ox = 0, oy = 0;
function resize() {
  const d = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  cv.width = w * d; cv.height = h * d;
  sc = Math.min(w / LW, h / LH) * d;
  ox = (cv.width - LW * sc) / 2; oy = (cv.height - LH * sc) / 2;
}
addEventListener('resize', resize); resize();

const TYPES = [
  { k: 'man',     w: 35, pts: 10,  sp: [50, 90],   c: '#d9a441', msg: 'Бульк!' },
  { k: 'baton',   w: 20, pts: 15,  sp: [50, 85],   c: '#7aa86b', msg: 'Батон промок!' },
  { k: 'courier', w: 20, pts: 25,  sp: [120, 170], c: '#2f8f83', msg: 'Курьер! Быстрый!' },
  { k: 'granny',  w: 12, pts: -20, sp: [25, 40],   c: '#b05a7a', msg: 'Бабушку жалко' },
  { k: 'cop',     w: 13, pts: -15, sp: [40, 60],   c: '#2f4a8a', msg: 'Полиция!' }
];
const rnd = (a, b) => a + Math.random() * (b - a);
function loadBest() { try { return +localStorage.getItem('balkon_best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('balkon_best', v); } catch (e) {} }

// Силуэт города (фиксированный)
const skyline = []; { let x = 40, s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  while (x < 380) { const w = 26 + r() * 34, h = 110 + r() * 220; skyline.push({ x, w, h, wins: Array.from({ length: 14 }, () => r() < .28) }); x += w - 4; } }

let S;
function reset() {
  const best = S ? S.best : loadBest();
  S = { shots: SHOTS, score: 0, b: null, people: [], parts: [], texts: [], wind: 0, drag: null, over: false, overT: 0, end: 0, spawn: .4, best, isNew: false };
  newWind();
}
function newWind() { S.wind = Math.round((Math.random() - .5) * 120); }
reset();

// ---------- ввод ----------
function pt(e) { const r = cv.getBoundingClientRect(), d = cv.width / r.width; return { x: ((e.clientX - r.left) * d - ox) / sc, y: ((e.clientY - r.top) * d - oy) / sc }; }
const BTN1 = { x: 70, y: 370, w: 220, h: 50 }, BTN2 = { x: 70, y: 432, w: 220, h: 46 };
const inB = (p, b) => p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h;
const canSend = () => tg && tg.initData;

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); const p = pt(e);
  if (S.over) {
    if (S.overT < .5) return;
    if (inB(p, BTN1)) reset();
    else if (canSend() && inB(p, BTN2)) { try { tg.sendData(JSON.stringify({ score: S.score })); } catch (er) {} }
    return;
  }
  if (S.b || S.shots <= 0) return;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  S.drag = { id: e.pointerId, ...clampPull(p) };
});
cv.addEventListener('pointermove', e => { if (S.drag && S.drag.id === e.pointerId) S.drag = { id: e.pointerId, ...clampPull(pt(e)) }; });
function release(e) {
  if (!S.drag || S.drag.id !== e.pointerId) return;
  const dx = S.drag.x - AX, dy = S.drag.y - AY, len = Math.hypot(dx, dy);
  S.drag = null;
  if (len < 14) return;
  S.b = { x: AX, y: AY, vx: -dx * 4.6, vy: -dy * 4.6 };
  S.shots--; buzz('i', 'light');
}
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
function clampPull(p) { let dx = p.x - AX, dy = p.y - AY; const l = Math.hypot(dx, dy); if (l > MAXPULL) { dx *= MAXPULL / l; dy *= MAXPULL / l; } return { x: AX + dx, y: AY + dy }; }

// ---------- логика ----------
function spawn() {
  let r = Math.random() * 100, t = TYPES[0];
  for (const ty of TYPES) { if (r < ty.w) { t = ty; break; } r -= ty.w; }
  const k = 1 + (SHOTS - S.shots) * .05, dir = Math.random() < .5 ? 1 : -1;
  S.people.push({ t, x: dir > 0 ? -20 : LW + 20, dir, sp: rnd(t.sp[0], t.sp[1]) * k, ph: Math.random() * 6, hit: false });
}
function splash(x, y, n, col) {
  for (let i = 0; i < n; i++) { const a = rnd(-Math.PI, 0), v = rnd(60, 220); S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(.4, .8), col }); }
}
function say(x, y, s, c) { S.texts.push({ x, y, s, c, life: 1.1 }); }

function update(dt) {
  if (S.over) { S.overT += dt; }
  S.spawn -= dt;
  if (S.spawn <= 0 && S.people.length < 4) { spawn(); S.spawn = rnd(.9, 2.2); }
  for (const p of S.people) { p.x += p.dir * p.sp * dt; p.ph += p.sp * dt * .13; }
  S.people = S.people.filter(p => p.x > -40 && p.x < LW + 40);

  const b = S.b;
  if (b) {
    b.vx += S.wind * dt; b.vy += GRAV * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    let done = false;
    for (const p of S.people) {
      if (!p.hit && Math.abs(b.x - p.x) < 17 && b.y > G - 62 && b.y < G + 4) {
        p.hit = true; S.score = Math.max(0, S.score + p.t.pts);
        splash(b.x, b.y, 18, '150,215,255'); say(p.x, G - 76, (p.t.pts > 0 ? '+' : '') + p.t.pts + ' ' + p.t.msg, p.t.pts > 0 ? '#9be37a' : '#ff7a7a');
        buzz('n', p.t.pts > 0 ? 'success' : 'warning'); done = true; break;
      }
    }
    if (!done && (b.y >= G + 2 || b.x < -30 || b.x > LW + 30)) {
      if (b.y >= G) { splash(b.x, G, 10, '150,215,255'); say(b.x, G - 20, Math.random() < .25 ? 'Попал в голубя' : 'Мимо', '#d6d3ee'); }
      done = true;
    }
    if (done) { S.b = null; newWind(); if (S.shots <= 0) S.end = .9; }
  }
  if (S.end > 0) { S.end -= dt; if (S.end <= 0) { S.over = true; S.overT = 0; if (S.score > S.best) { S.best = S.score; S.isNew = true; saveBest(S.best); } } }

  for (const q of S.parts) { q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  S.parts = S.parts.filter(q => q.life > 0 && q.y < G + 10);
  for (const t of S.texts) { t.y -= 28 * dt; t.life -= dt; }
  S.texts = S.texts.filter(t => t.life > 0);
}

// ---------- рисование ----------
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); cx.fill(); }
function circ(x, y, r) { cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); }
function text(s, x, y, size, col, align, weight) { cx.font = (weight || 'bold') + ' ' + size + 'px ' + FONT; cx.textAlign = align || 'center'; cx.fillStyle = col; cx.fillText(s, x, y); }

function drawBalloon(x, y, ang) {
  cx.save(); cx.translate(x, y); cx.rotate(ang);
  cx.fillStyle = 'rgba(150,215,255,.85)'; cx.strokeStyle = 'rgba(255,255,255,.9)'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.ellipse(0, 0, 6, 10, 0, 0, 7); cx.fill(); cx.stroke();
  cx.beginPath(); cx.moveTo(-2.5, 9.5); cx.lineTo(0, 15); cx.lineTo(2.5, 9.5); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,.75)'; cx.beginPath(); cx.ellipse(-2, -3, 1.6, 4, 0, 0, 7); cx.fill();
  cx.restore();
}

function drawPerson(p) {
  const sw = Math.sin(p.ph) * 6, k = p.t.k;
  cx.save(); cx.translate(p.x, G); if (p.dir < 0) cx.scale(-1, 1);
  if (k === 'granny') cx.scale(.92, .92);
  cx.strokeStyle = '#1d1b2e'; cx.lineWidth = 4; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(-2.5, -20); cx.lineTo(-2.5 + sw, 0); cx.moveTo(2.5, -20); cx.lineTo(2.5 - sw, 0); cx.stroke();
  if (k === 'courier') { cx.fillStyle = '#ffd23f'; rr(-19, -46, 14, 16, 2); }
  if (k === 'baton') { cx.save(); cx.rotate(-.35); cx.fillStyle = '#d9a35f'; rr(5, -44, 6, 28, 3); cx.restore(); }
  cx.fillStyle = p.hit ? '#3d8fd1' : p.t.c; rr(-9, -43, 18, 25, 6);
  cx.fillStyle = '#f0c9a0'; circ(0, -51, 8);
  cx.beginPath(); cx.arc(0, -51, 8.6, Math.PI, 2 * Math.PI);
  if (k === 'granny') { cx.fillStyle = '#d8d4e4'; cx.fill(); circ(-6, -58, 4); }
  else if (k === 'cop') { cx.fillStyle = '#1a2a55'; cx.fill(); cx.fillRect(0, -53, 11, 3); }
  else if (k === 'courier') { cx.fillStyle = '#ffd23f'; cx.fill(); }
  else { cx.fillStyle = '#4a3326'; cx.fill(); }
  cx.fillStyle = '#1d1b2e'; circ(3.5, -51, 1.2);
  if (p.hit) { cx.fillStyle = 'rgba(150,215,255,.9)'; circ(-6, -14, 1.6); circ(6, -10, 1.6); circ(0, -6, 1.4); }
  cx.restore();
}

function drawScene() {
  // небо
  const g = cx.createLinearGradient(0, 0, 0, G); g.addColorStop(0, '#15173f'); g.addColorStop(.6, '#4a3a7a'); g.addColorStop(1, '#e98a6b');
  cx.fillStyle = g; cx.fillRect(0, 0, LW, G);
  // дома вдали
  for (const s of skyline) {
    cx.fillStyle = '#26214a'; cx.fillRect(s.x, G - s.h, s.w, s.h);
    s.wins.forEach((on, i) => { if (!on) return; cx.fillStyle = '#ffd98a'; cx.fillRect(s.x + 5 + (i % 3) * 9, G - s.h + 10 + Math.floor(i / 3) * 16, 4, 6); });
  }
  // тротуар и дорога
  cx.fillStyle = '#5b5578'; cx.fillRect(0, G, LW, 22);
  cx.fillStyle = '#25223d'; cx.fillRect(0, G + 22, LW, LH - G - 22);
  cx.fillStyle = '#6a648c'; for (let x = 6; x < LW; x += 48) cx.fillRect(x, G + 62, 26, 3);
  // наш дом
  cx.fillStyle = '#322d58'; cx.fillRect(0, 0, 56, G);
  cx.fillStyle = '#ffd98a'; for (let y = 210; y < G - 30; y += 52) { cx.fillRect(10, y, 14, 20); cx.fillRect(32, y, 14, 20); }
  // балкон
  cx.fillStyle = '#9a92b0'; rr(44, 160, 80, 9, 2);
  cx.fillStyle = '#6f6890'; rr(44, 169, 80, 5, 1);
  cx.strokeStyle = '#c8c1de'; cx.lineWidth = 3; cx.lineCap = 'butt';
  cx.beginPath(); cx.moveTo(48, 128); cx.lineTo(120, 128); cx.stroke();
  cx.lineWidth = 2; for (let x = 52; x <= 120; x += 12) { cx.beginPath(); cx.moveTo(x, 128); cx.lineTo(x, 160); cx.stroke(); }
  // человечек на балконе
  cx.fillStyle = '#1d1b2e'; rr(66, 118, 14, 42, 5); cx.fillStyle = '#f0c9a0'; circ(73, 108, 8);
  cx.fillStyle = '#4a3326'; cx.beginPath(); cx.arc(73, 108, 8.6, Math.PI, 2 * Math.PI); cx.fill();
}

function trajectory() {
  const dx = S.drag.x - AX, dy = S.drag.y - AY;
  let x = AX, y = AY, vx = -dx * 4.6, vy = -dy * 4.6; const h = .045;
  cx.fillStyle = 'rgba(255,255,255,.75)';
  for (let i = 0; i < 16; i++) {
    for (let j = 0; j < 2; j++) { vx += S.wind * h; vy += GRAV * h; x += vx * h; y += vy * h; }
    if (y > G) break; circ(x, y, 2.6 - i * .08);
  }
}

function drawWind() {
  const x = 300, y = 66, w = S.wind, a = Math.min(Math.abs(w) / 60, 1) * 34;
  text('ветер', x, y - 14, 12, '#d6d3ee', 'center', 'normal');
  if (Math.abs(w) < 4) { text('штиль', x, y + 6, 13, '#d6d3ee', 'center', 'normal'); return; }
  const d = Math.sign(w); cx.strokeStyle = '#ffd98a'; cx.fillStyle = '#ffd98a'; cx.lineWidth = 3; cx.lineCap = 'round';
  const x1 = x - d * a / 2, x2 = x + d * a / 2;
  cx.beginPath(); cx.moveTo(x1, y); cx.lineTo(x2, y); cx.stroke();
  cx.beginPath(); cx.moveTo(x2, y); cx.lineTo(x2 - d * 8, y - 6); cx.lineTo(x2 - d * 8, y + 6); cx.fill();
}

function drawHUD() {
  text('Очки', 14, 26, 12, '#d6d3ee', 'left', 'normal'); text(S.score, 14, 52, 28, '#fff', 'left');
  text('Шариков', 346, 26, 12, '#d6d3ee', 'right', 'normal');
  for (let i = 0; i < SHOTS; i++) { cx.globalAlpha = i < S.shots ? 1 : .22; cx.fillStyle = 'rgba(150,215,255,.95)'; cx.beginPath(); cx.ellipse(338 - (SHOTS - 1 - i) * 13 + 0, 38, 4, 6.5, 0, 0, 7); cx.fill(); }
  cx.globalAlpha = 1;
  drawWind();
}

function drawOver() {
  cx.fillStyle = 'rgba(14,12,38,.82)'; cx.fillRect(0, 0, LW, LH);
  text('Шарики кончились', 180, 200, 28, '#fff');
  text('Очки', 180, 262, 14, '#d6d3ee', 'center', 'normal');
  text(S.score, 180, 312, 52, '#ffd98a');
  text(S.isNew ? 'Новый рекорд!' : 'Рекорд: ' + S.best, 180, 342, 16, S.isNew ? '#9be37a' : '#d6d3ee');
  cx.fillStyle = '#ffd98a'; rr(BTN1.x, BTN1.y, BTN1.w, BTN1.h, 14); text('Ещё раз', 180, BTN1.y + 32, 20, '#2a2140');
  if (canSend()) { cx.fillStyle = '#3d8fd1'; rr(BTN2.x, BTN2.y, BTN2.w, BTN2.h, 14); text('Отправить счёт боту', 180, BTN2.y + 29, 16, '#fff'); }
}

function draw(now) {
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#15173f'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.setTransform(sc, 0, 0, sc, ox, oy); cx.save(); cx.beginPath(); cx.rect(0, 0, LW, LH); cx.clip();
  drawScene();
  S.people.slice().sort((a, b) => a.t.pts - b.t.pts).forEach(drawPerson);
  // рогатка и шарик в руке
  if (S.drag) {
    cx.strokeStyle = '#e8b4b8'; cx.lineWidth = 2.5; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(AX - 9, AY + 8); cx.lineTo(S.drag.x, S.drag.y); cx.lineTo(AX + 9, AY + 8); cx.stroke();
    trajectory(); drawBalloon(S.drag.x, S.drag.y, Math.atan2(-(S.drag.y - AY), -(S.drag.x - AX)) + Math.PI / 2);
  } else if (!S.b && S.shots > 0) drawBalloon(AX, AY, .15 * Math.sin(now / 400));
  if (S.b) drawBalloon(S.b.x, S.b.y, Math.atan2(S.b.vy, S.b.vx) + Math.PI / 2);
  for (const q of S.parts) { cx.fillStyle = 'rgba(' + q.col + ',' + Math.min(1, q.life * 2) + ')'; circ(q.x, q.y, 2.4); }
  for (const t of S.texts) { cx.globalAlpha = Math.min(1, t.life * 2); text(t.s, Math.max(70, Math.min(LW - 70, t.x)), t.y, 15, t.c); cx.globalAlpha = 1; }
  drawHUD();
  if (S.score === 0 && S.shots === SHOTS && !S.b) {
    cx.globalAlpha = S.drag ? .25 : .95;
    text('Оттяни шарик вниз и влево,', 215, 250, 14, '#fff', 'center', 'normal'); text('отпусти и попади в прохожего', 215, 270, 14, '#fff', 'center', 'normal');
    cx.globalAlpha = 1;
  }
  if (S.over) drawOver();
  cx.restore();
}

let last = performance.now();
function loop(now) { const dt = Math.min((now - last) / 1000, .033); last = now; update(dt); draw(now); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
